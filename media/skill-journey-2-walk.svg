<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 770">
  <style>
    svg { --fgn-accent: #00662c; --fgn-fg: #2b2422; }
    @media (prefers-color-scheme: dark) { svg { --fgn-accent: #5bae6f; --fgn-fg: #ece5e1; } }
    .stone { fill: var(--fgn-accent); }
    .step { fill: none; stroke: var(--fgn-fg); stroke-width: 8.0;
             stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style data-fgn-draw="">
    svg { --draw-total: 2s; --draw-dur: .18s; }
    .draw { stroke-dasharray: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .draw { animation: fgn-draw var(--draw-dur) linear both;
              animation-delay: calc(var(--at) * var(--draw-total)); }
    }
    @keyframes fgn-draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
    .pop { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .pop { animation: fgn-pop var(--draw-dur) ease-out both;
             animation-delay: calc(var(--at) * var(--draw-total)); }
    }
    @keyframes fgn-pop { from { opacity: 0; transform: scale(.3) }
                        to { opacity: 1; transform: scale(1) } }
